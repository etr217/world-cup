<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Bracket Scorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg:      #12151c;
    --surface: #1e2433;
    --border:  #3a4254;
    --text:    #e8ecf1;
    --muted:   #9aa3b5;
    --accent:  #4d9bff;
    --CARD-H:  38px;
    --GAP-W:   28px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: auto; }

  header {
    background: linear-gradient(135deg, #1a2030 0%, #12151c 55%, #1a2030 100%);
    border-bottom: 3px solid var(--accent);
    padding: 14px 22px 11px;
    display: flex; align-items: center; gap: 13px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(16px,2.5vw,28px); letter-spacing: 3px; color: var(--accent); line-height: 1; }
  header p  { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
  .header-actions { margin-left: auto; display: flex; gap: 7px; align-items: center; }

  .btn { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; transition: all .15s; }
  .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { background: var(--accent); color: #fff; font-weight: 700; }
  .btn-accent:hover { background: #3a85e0; color: #fff; }

  /* Leaderboard (center bottom) */
  .leaderboard-title { font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--accent); text-align: center; padding: 0 0 8px; margin-top: auto; padding-top: 18px; }
  .leaderboard-panel { width: 100%; padding-top: 0; }
  .leaderboard { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .lb-row { display: grid; grid-template-columns: 22px 12px minmax(0, 0.55fr) minmax(120px, 3fr) 72px; gap: 8px; align-items: center; }
  .lb-rank {
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
    font-variant-numeric: tabular-nums; text-align: right; color: var(--muted);
  }
  .lb-rank.gold   { color: #f5c518; }
  .lb-rank.silver { color: #adb5bd; }
  .lb-rank.bronze { color: #cd7f32; }
  .lb-dot  { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
  .lb-name {
    font-size: 12px; font-weight: 700; color: var(--text);
    line-height: 1.25; cursor: pointer; min-width: 0;
  }
  .lb-name:hover { color: var(--accent); }
  .lb-row.active .lb-name { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .lb-back-btn {
    display: block; width: 100%; margin-bottom: 8px;
    font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase;
    padding: 5px 8px; border-radius: 4px;
    border: 1.5px solid var(--accent); background: transparent;
    color: var(--accent); cursor: pointer;
  }
  .lb-back-btn:hover { background: var(--accent); color: #fff; }
  .lb-bar-track {
    position: relative;
    height: 26px;
    background: #2a3142;
    border: 1px solid #4a5568;
    border-radius: 2px;
    overflow: hidden;
  }
  .lb-bar-track::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(25% - 0.5px),
      rgba(255, 255, 255, 0.08) calc(25% - 0.5px),
      rgba(255, 255, 255, 0.08) 25%
    );
    pointer-events: none;
  }
  .lb-bar-fill {
    position: relative;
    z-index: 1;
    height: 100%;
    min-width: 3px;
    border-radius: 0 2px 2px 0;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-left: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: width 0.35s ease;
  }
  .lb-score {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    text-align: right;
    white-space: nowrap;
  }
  .lb-max { font-size: 12px; font-weight: 600; color: var(--muted); }
  .legend-empty { color: var(--muted); font-style: italic; font-size: 12px; }

  /* Bracket layout */
  .bracket-scroll {
    padding: 18px 16px 80px 20px;
    overflow-x: auto;
    position: relative;
    z-index: 1;
    min-height: calc(100vh - 67px);
  }

  .bracket-outer {
    display: grid;
    grid-template-columns: auto auto auto auto auto;
    justify-content: space-between;
    align-items: stretch;
    width: 100%;
    min-width: 100%;
    min-height: calc(100vh - 110px);
  }
  .half { display: flex; align-items: stretch; height: 100%; }
  .half.right { flex-direction: row-reverse; }

  .round-col { display: flex; flex-direction: column; width: max-content; min-width: 80px; flex-shrink: 0; height: 100%; align-self: stretch; }
  .round-label { font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--accent); text-align: center; padding: 3px 0 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .round-slots { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .team-slot { display: flex; flex-direction: column; justify-content: center; flex: 1; min-height: 0; }

  .match-pair { display: flex; flex-direction: column; width: 100%; }

  /* Team row */
  .mc {
    display: flex; flex-direction: column;
    padding: 0;
    background: var(--surface); border: 1.5px solid var(--border);
    user-select: none; width: 100%;
  }
  .mc:first-child { border-radius: 4px 4px 0 0; border-bottom: none; }
  .mc:last-child  { border-radius: 0 0 4px 4px; }
  .mc.picked { border-color: #9ca3af; }
  .mc.hypo-win     { background: #14532d; border-color: #22c55e; }
  .mc.hypo-correct { background: #22c55e; border-color: #4ade80; color: #fff; }
  .mc.hypo-correct .tname { color: #fff; }
  .mc.hypo-loss { background: #450a0a; border-color: #ef4444; }
  .mc.tbd { cursor: default; opacity: 0.35; }
  .mc.tbd:hover { border-color: var(--border); }

  /* Team name row inside the card */
  .mc-content { display: flex; align-items: center; gap: 5px; width: 100%; padding: 8px 8px 2px; }
  .half.right .mc-content { flex-direction: row-reverse; }

  /* Dot row inside the card, below the team name */
  .dot-row { display: flex; flex-direction: row; gap: 3px; padding: 0 8px 5px; }
  .half.right .dot-row { justify-content: flex-end; }
  .pick-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .flag { font-size: 18px; line-height: 1; flex-shrink: 0; }
  .tname { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; color: var(--text); flex: 1; }
  .half.right .tname { text-align: right; }
  .pick-check { font-size: 9px; color: #9ca3af; flex-shrink: 0; }
  .match-date { font-size:9px; color:var(--muted); letter-spacing:0.3px; text-align:center; padding:2px 0 2px; opacity:0.8; }
  .match-date.today { color: #fb923c; opacity: 1; font-weight: 600; }
  .match-pair.today,
  .match-block.today { outline: 2.5px solid #fb923c; outline-offset: 2px; border-radius: 5px; }

  /* Gap cols */
  .gap-col, .final-gap { flex-shrink: 0; position: relative; overflow: visible; align-self: stretch; height: 100%; }
  .gap-col { width: var(--GAP-W); }
  .final-gap { width: var(--GAP-W); }
  .gap-col svg, .final-gap svg { position: absolute; top: 0; left: 0; overflow: visible; }

  /* Center */
  .center-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 500px; flex-shrink: 0; padding: 12px 8px 0; height: 100%; align-self: stretch; }
  .center-label { font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--accent); text-align: center; padding: 3px 0 8px; border-bottom: 1px solid var(--border); width: 100%; margin-bottom: 10px; align-self: stretch; }
  .champ-card { background: linear-gradient(145deg,#1a2e1f,#152418); border: 2px solid #22c55e; border-radius: 10px; padding: 16px 10px; text-align: center; box-shadow: 0 0 20px rgba(34,197,94,0.2); width: 100%; }
  .champ-trophy { font-size: 28px; }
  .champ-flag   { font-size: 24px; margin-top: 5px; }
  .champ-name   { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 2px; color: #4ade80; margin-top: 3px; }
  .champ-empty  { font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.4; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 8px 18px; border-radius: 99px; z-index: 300; transition: transform .3s cubic-bezier(.34,1.56,.64,1); pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 22px; width: 400px; max-width: 94vw; }
  .modal h3 { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--accent); margin-bottom: 4px; }
  .modal p  { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .modal textarea { width: 100%; background: #0d1117; border: 1.5px solid var(--border); border-radius: 4px; color: var(--text); font-family: monospace; font-size: 11px; padding: 8px 10px; outline: none; margin-bottom: 10px; resize: vertical; }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <span style="font-size:26px">🏆</span>
  <div>
    <h1>World Cup 2026 — Bracket Scorer</h1>
    <p>Actual results from <code>brackets/actual</code> · score everyone's picks</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="clearBrackets()">Clear brackets</button>
    <button class="btn btn-ghost" onclick="downloadSnapshot()">Download snapshot</button>
    <button class="btn btn-accent" onclick="openImportModal()">+ Add bracket</button>
  </div>
</header>

<div class="bracket-scroll">
  <div class="bracket-outer" id="bracket"></div>
</div>

<div class="modal-bg" id="importModal">
  <div class="modal">
    <h3>Add bracket</h3>
    <p>Paste JSON or choose a file — the name is read from the bracket automatically.</p>
    <textarea id="importPaste" rows="5" placeholder="Paste bracket JSON here…"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
      <button class="btn btn-ghost" style="font-size:11px;" onclick="document.getElementById('fileInput').click()">📁 Choose file</button>
      <span id="fileName" style="font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeImportModal()">Cancel</button>
      <button class="btn btn-accent" onclick="confirmImport()">Add</button>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="onFilePicked(event)">
<div class="toast" id="toast"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const PALETTE = [
  // normal — 6 distinct hues
  '#E6194B', '#3CB44B', '#4363D8', '#F58231', '#911EB4', '#42D4F4',
  // light — 6 different hues (not tints of the above)
  '#FFE119', '#F032E6', '#BFEF45', '#FABED4', '#DCBEFF', '#FFFFFF',
  // dark — 6 different hues + black
  '#000000', '#469990', '#9A6324', '#800000', '#000075', '#808080',
];

function needsColorBorder(color) {
  const c = color.toLowerCase();
  return c === '#ffffff' || c === '#fff';
}

function colorBgStyle(color) {
  return needsColorBorder(color)
    ? `background:${color};border:1.5px solid #374151;`
    : `background:${color};`;
}

function strokeColor(color) {
  return needsColorBorder(color) ? '#374151' : color;
}

const TEAM_META = {
  "South Africa":  { flag:"🇿🇦", abbr:"RSA" }, "Canada":           { flag:"🇨🇦", abbr:"CAN" },
  "Netherlands":   { flag:"🇳🇱", abbr:"NED" }, "Morocco":          { flag:"🇲🇦", abbr:"MAR" },
  "Germany":       { flag:"🇩🇪", abbr:"GER" }, "Paraguay":         { flag:"🇵🇾", abbr:"PAR" },
  "France":        { flag:"🇫🇷", abbr:"FRA" }, "Sweden":           { flag:"🇸🇪", abbr:"SWE" },
  "Belgium":       { flag:"🇧🇪", abbr:"BEL" }, "Senegal":          { flag:"🇸🇳", abbr:"SEN" },
  "USA":           { flag:"🇺🇸", abbr:"USA" }, "Bosnia & Hz":      { flag:"🇧🇦", abbr:"BIH" },
  "Spain":         { flag:"🇪🇸", abbr:"ESP" }, "Austria":          { flag:"🇦🇹", abbr:"AUT" },
  "Portugal":      { flag:"🇵🇹", abbr:"POR" }, "Croatia":          { flag:"🇭🇷", abbr:"CRO" },
  "Brazil":        { flag:"🇧🇷", abbr:"BRA" }, "Japan":            { flag:"🇯🇵", abbr:"JPN" },
  "Côte d'Ivoire": { flag:"🇨🇮", abbr:"CIV" }, "Norway":           { flag:"🇳🇴", abbr:"NOR" },
  "Mexico":        { flag:"🇲🇽", abbr:"MEX" }, "Ecuador":          { flag:"🇪🇨", abbr:"ECU" },
  "England":       { flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", abbr:"ENG" }, "DR Congo":        { flag:"🇨🇩", abbr:"COD" },
  "Switzerland":   { flag:"🇨🇭", abbr:"SUI" }, "Algeria":          { flag:"🇩🇿", abbr:"ALG" },
  "Colombia":      { flag:"🇨🇴", abbr:"COL" }, "Ghana":            { flag:"🇬🇭", abbr:"GHA" },
  "Australia":     { flag:"🇦🇺", abbr:"AUS" }, "Egypt":            { flag:"🇪🇬", abbr:"EGY" },
  "Argentina":     { flag:"🇦🇷", abbr:"ARG" }, "Cabo Verde":       { flag:"🇨🇻", abbr:"CPV" },
};
const R32_LEFT  = [["South Africa","Canada"],["Netherlands","Morocco"],["Germany","Paraguay"],["France","Sweden"],["Belgium","Senegal"],["USA","Bosnia & Hz"],["Spain","Austria"],["Portugal","Croatia"]];
const R32_RIGHT = [["Brazil","Japan"],["Côte d'Ivoire","Norway"],["Mexico","Ecuador"],["England","DR Congo"],["Switzerland","Algeria"],["Colombia","Ghana"],["Australia","Egypt"],["Argentina","Cabo Verde"]];
const ROUND_LABELS = ["Round of 32","Round of 16","Quarter-Finals","Semi-Finals"];
const COUNTS_SIDE  = [8, 4, 2, 1];

const R32_SCHEDULE = {
  left:  ["Jun 28, 12pm","Jun 29, 6pm","Jun 29, 1:30pm","Jun 30, 2pm","Jul 1, 1pm","Jul 1, 5pm","Jul 2, 12pm","Jul 2, 4pm"],
  right: ["Jun 29, 10am","Jun 30, 10am","Jun 30, 6pm","Jul 1, 9am","Jul 2, 8pm","Jul 3, 6:30pm","Jul 3, 11am","Jul 3, 3pm"],
};

// R16: left pairs (mi=0..3), right pairs (mi=0..3) — all PT
const R16_SCHEDULE = {
  left:  ["Jul 4, 10am","Jul 4, 2pm","Jul 6, 2pm","Jul 6, 12pm"],
  right: ["Jul 5, 1pm","Jul 5, 5pm","Jul 7, 1pm","Jul 7, 9am"],
};

// QF: left (mi=0..1), right (mi=0..1) — all PT
const QF_SCHEDULE = {
  left:  ["Jul 9, 1pm","Jul 10, 12pm"],
  right: ["Jul 11, 2pm","Jul 11, 6pm"],
};

// SF: left (mi=0), right (mi=0) — all PT
const SF_SCHEDULE = {
  left:  ["Jul 14, 12pm"],
  right: ["Jul 15, 12pm"],
};

const FINAL_SCHEDULE   = "Jul 19, 12pm PT";
const THIRD_SCHEDULE   = "Jul 18, 2pm PT";
const WC_YEAR = 2026;
const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };

function isScheduleToday(schedStr) {
  const m = schedStr.match(/^([A-Za-z]+)\s+(\d+)/);
  if (!m) return false;
  const month = MONTHS[m[1]];
  if (month === undefined) return false;
  const gameDay = new Date(WC_YEAR, month, parseInt(m[2], 10));
  gameDay.setHours(0, 0, 0, 0);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return gameDay.getTime() === today.getTime();
}

function flag(name) { return (TEAM_META[name]||{}).flag||''; }
function abbr(name) { return (TEAM_META[name]||{}).abbr||name.slice(0,3).toUpperCase(); }
function tbd()      { return { name:"TBD", flag:"", abbr:"" }; }
function makeTeam(name) { return { name, flag:flag(name), abbr:abbr(name) }; }

// ── STATE ────────────────────────────────────────────────────────────────────
// `results` loaded from brackets/actual — participant brackets scored against it

function buildResults() {
  const make = (side, pairs) => COUNTS_SIDE.map((count, ri) =>
    Array.from({ length: count }, (_, mi) =>
      ri === 0
        ? { teams: [makeTeam(pairs[mi][0]), makeTeam(pairs[mi][1])], winner: null }
        : { teams: [tbd(), tbd()], winner: null }
    )
  );
  return {
    left:     make('left',  R32_LEFT),
    right:    make('right', R32_RIGHT),
    final:    { teams: [tbd(), tbd()], winner: null },
    third:    { teams: [tbd(), tbd()], winner: null },
    champion: null,
  };
}

let results  = buildResults();
let brackets = [];
let nextColorIdx = 0;
let viewingBracketIdx = null;

function bracketDisplayData() {
  return viewingBracketIdx !== null ? brackets[viewingBracketIdx].data : results;
}

function showActualBracket() {
  viewingBracketIdx = null;
  render();
}

function showBracket(idx) {
  if (idx < 0 || idx >= brackets.length) return;
  viewingBracketIdx = idx;
  render();
}

function mcClasses(displayMatch, ti, actualMatch, hypothetical) {
  const team = displayMatch.teams[ti];
  if (team.name === 'TBD') return 'mc tbd';
  if (!hypothetical) {
    return 'mc' + (displayMatch.winner === ti ? ' picked' : '');
  }
  if (displayMatch.winner === null) return 'mc';
  if (displayMatch.winner === ti) {
    if (actualMatch?.winner !== null) {
      const pickName = displayMatch.teams[displayMatch.winner].name;
      const actualName = actualMatch.teams[actualMatch.winner].name;
      if (pickName === actualName) return 'mc hypo-correct';
    }
    return 'mc hypo-win';
  }
  return 'mc hypo-loss';
}

function applyActualData(data) {
  if (!data.left || !data.right || !data.final) throw new Error('Invalid actual bracket');
  results = {
    left: data.left,
    right: data.right,
    final: data.final,
    third: data.third || { teams: [tbd(), tbd()], winner: null },
    champion: data.champion ?? (
      data.final.winner !== null && data.final.winner !== undefined
        ? data.final.teams[data.final.winner]
        : null
    ),
  };
}

// ── BRACKET QUERY HELPERS ────────────────────────────────────────────────────
function getBracketWinner(bData, side, ri, mi) {
  try { const m = bData[side][ri][mi]; return m.winner !== null ? m.teams[m.winner].name : null; }
  catch { return null; }
}
function getBracketFinalWinner(bData) {
  try { const m = bData.final; return m.winner !== null ? m.teams[m.winner].name : null; }
  catch { return null; }
}

// Which brackets picked `teamName` as winner of (side, ri, mi)?
function bracketsPickedWinner(side, ri, mi, teamName) {
  return brackets.filter(b => getBracketWinner(b.data, side, ri, mi) === teamName);
}
function bracketsPickedFinalWinner(teamName) {
  return brackets.filter(b => getBracketFinalWinner(b.data) === teamName);
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  renderBracket();
  renderLegend();
}

// ── SCORING ───────────────────────────────────────────────────────────────────
const ROUND_POINTS = [1, 2, 4, 8]; // R32, R16, QF, SF (per side)
const FINAL_POINTS  = 16;
const THIRD_POINTS  = 3;

function scoreFor(b) {
  let pts = 0;
  // Left and right side rounds
  ['left','right'].forEach(side => {
    COUNTS_SIDE.forEach((count, ri) => {
      const ppw = ROUND_POINTS[ri];
      for (let mi = 0; mi < count; mi++) {
        const actual = results[side][ri][mi];
        if (actual.winner === null) continue;
        const actualWinner = actual.teams[actual.winner].name;
        if (getBracketWinner(b.data, side, ri, mi) === actualWinner) pts += ppw;
      }
    });
  });
  // Final
  if (results.final.winner !== null) {
    const actualFinal = results.final.teams[results.final.winner].name;
    if (getBracketFinalWinner(b.data) === actualFinal) pts += FINAL_POINTS;
  }
  // Third place
  if (results.third.winner !== null) {
    const actualThird = results.third.teams[results.third.winner].name;
    try {
      const bThird = b.data.third;
      if (bThird && bThird.winner !== null && bThird.teams[bThird.winner].name === actualThird) pts += THIRD_POINTS;
    } catch {}
  }
  return pts;
}

// Teams that have already lost in the actual results (and are thus eliminated)
function eliminatedTeams() {
  const set = new Set();
  const addLoser = (m) => {
    if (!m || m.winner === null || m.winner === undefined) return;
    const loser = m.teams[m.winner === 0 ? 1 : 0];
    if (loser && loser.name && loser.name !== 'TBD') set.add(loser.name);
  };
  ['left','right'].forEach(side => {
    COUNTS_SIDE.forEach((count, ri) => {
      for (let mi = 0; mi < count; mi++) addLoser(results[side][ri][mi]);
    });
  });
  addLoser(results.final);
  return set;
}

// Red → yellow → green gradient across the range of max scores (lowest red, highest green)
function maxScoreColor(val, lo, hi) {
  const t = hi > lo ? (val - lo) / (hi - lo) : 1;
  const hue = t * 120; // 0 = red, 120 = green
  return `hsl(${hue}, 70%, 60%)`;
}

// Best possible score: every still-alive pick wins whenever the match is undecided
function maxScoreFor(b, elim) {
  let pts = 0;
  const stillPossible = (pick) => pick && pick !== 'TBD' && !elim.has(pick);
  ['left','right'].forEach(side => {
    COUNTS_SIDE.forEach((count, ri) => {
      const ppw = ROUND_POINTS[ri];
      for (let mi = 0; mi < count; mi++) {
        const actual = results[side][ri][mi];
        const pick = getBracketWinner(b.data, side, ri, mi);
        if (actual.winner !== null) {
          if (pick === actual.teams[actual.winner].name) pts += ppw;
        } else if (stillPossible(pick)) {
          pts += ppw;
        }
      }
    });
  });
  // Final
  const finalPick = getBracketFinalWinner(b.data);
  if (results.final.winner !== null) {
    if (finalPick === results.final.teams[results.final.winner].name) pts += FINAL_POINTS;
  } else if (stillPossible(finalPick)) {
    pts += FINAL_POINTS;
  }
  // Third place
  let thirdPick = null;
  try { const t = b.data.third; if (t && t.winner !== null) thirdPick = t.teams[t.winner].name; } catch {}
  if (results.third.winner !== null) {
    if (thirdPick && thirdPick === results.third.teams[results.third.winner].name) pts += THIRD_POINTS;
  } else if (stillPossible(thirdPick)) {
    pts += THIRD_POINTS;
  }
  return pts;
}

function renderLegend() {
  const bar = document.getElementById('legendBar');
  if (!bar) return;
  if (!brackets.length) {
    bar.innerHTML = '<span class="legend-empty">No brackets loaded — click "+ Add bracket" to start</span>';
    return;
  }

  const elim = eliminatedTeams();
  const scored = brackets.map((b, i) => ({ ...b, i, pts: scoreFor(b), maxPts: maxScoreFor(b, elim) }))
    .sort((a, b) => b.pts - a.pts);

  let place = 1;
  const ranked = scored.map((b, i) => {
    if (i > 0 && b.pts < scored[i - 1].pts) place = i + 1;
    return { ...b, place };
  });

  const maxPts = Math.max(...scored.map(b => b.pts), 1);
  const maxVals = scored.map(b => b.maxPts);
  const loMax = Math.min(...maxVals), hiMax = Math.max(...maxVals);
  const rankColors = { 1: 'gold', 2: 'silver', 3: 'bronze' };
  const backBtn = viewingBracketIdx !== null
    ? '<button type="button" class="lb-back-btn" onclick="showActualBracket()">← Actual results</button>'
    : '';

  bar.innerHTML = `${backBtn}<div class="leaderboard">${
    ranked.map((b) => {
      const pct = maxPts > 0 ? (b.pts / maxPts) * 100 : 0;
      const active = viewingBracketIdx === b.i ? ' active' : '';
      const placeLabel = b.place <= 3 ? b.place : '';
      const placeClass = rankColors[b.place] || '';
      return `
        <div class="lb-row${active}">
          <div class="lb-rank ${placeClass}">${placeLabel}</div>
          <div class="lb-dot" style="${colorBgStyle(b.color)}"></div>
          <div class="lb-name" onclick="showBracket(${b.i})" title="View ${b.name}'s bracket">${b.name}</div>
          <div class="lb-bar-track">
            <div class="lb-bar-fill" style="width:${pct}%;${colorBgStyle(b.color)}"></div>
          </div>
          <div class="lb-score">${b.pts} <span class="lb-max" style="color:${maxScoreColor(b.maxPts, loMax, hiMax)}">(${b.maxPts})</span></div>
        </div>`;
    }).join('')
  }</div>`;
}

// ── LINES ────────────────────────────────────────────────────────────────────
const HYPO_LINE_COLOR = '#15803d';

function drawLines() {
  if (viewingBracketIdx === null) drawAllLines();
  else drawHypotheticalLines(bracketDisplayData());
}

function drawHypotheticalLines(display) {
  const el = document.getElementById('bracket');

  el.querySelectorAll('.gap-col').forEach(gap => {
    const side = gap.dataset.side, ri = parseInt(gap.dataset.ri), prevRi = ri - 1;
    const isRight = side === 'right';
    const gapRect = gap.getBoundingClientRect();
    const { svg } = makeSVG(gap, gapRect);
    const x0 = 0, x1 = gapRect.width, xMid = gapRect.width / 2;
    const fromX = isRight ? x1 : x0, toX = isRight ? x0 : x1;

    for (let mi = 0; mi < COUNTS_SIDE[ri]; mi++) {
      const dstSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${ri}"][data-mi="${mi}"]`);
      if (!dstSlot) continue;
      const dstMcs = dstSlot.querySelectorAll('.mc');
      if (dstMcs.length < 2) continue;

      [0, 1].forEach(arm => {
        const srcMi = mi * 2 + arm;
        const rm = display[side][prevRi][srcMi];
        if (rm.winner === null) return;

        const winnerName = rm.teams[rm.winner].name;
        const destMatch = display[side][ri][mi];
        if (destMatch.teams[arm].name !== winnerName) return;
        if (destMatch.winner === null) return;
        if (destMatch.teams[destMatch.winner].name !== winnerName) return;

        const srcSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${prevRi}"][data-mi="${srcMi}"]`);
        if (!srcSlot) return;
        const srcMcs = srcSlot.querySelectorAll('.mc');
        if (!srcMcs[rm.winner]) return;
        const srcY = midY(srcMcs[rm.winner], gapRect);
        const dstY = midY(dstMcs[destMatch.winner], gapRect);

        path(svg, fromX, srcY, xMid, srcY, xMid, dstY, toX, dstY, HYPO_LINE_COLOR, 2);
      });
    }
  });

  el.querySelectorAll('.final-gap').forEach(gap => {
    const side = gap.dataset.side, isRight = side === 'right';
    const sfRi = COUNTS_SIDE.length - 1;
    const gapRect = gap.getBoundingClientRect();
    const finalTi = side === 'left' ? 0 : 1;

    const sfSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${sfRi}"][data-mi="0"]`);
    const finalMcs = document.querySelectorAll('#final-match > .mc');
    if (!sfSlot || !finalMcs[finalTi]) return;
    const sfMcs = sfSlot.querySelectorAll('.mc');

    const rm = display[side][sfRi][0];
    if (rm.winner === null || !sfMcs[rm.winner]) return;
    const winnerName = rm.teams[rm.winner].name;

    const finalMatch = display.final;
    if (finalMatch.teams[finalTi].name !== winnerName) return;
    if (finalMatch.winner === null) return;
    if (finalMatch.teams[finalMatch.winner].name !== winnerName) return;

    const srcMc = sfMcs[rm.winner];
    const dstMc = finalMcs[finalTi];
    const srcY = midY(srcMc, gapRect);
    const dstY = midY(dstMc, gapRect);
    const { fromX, toX, xMid } = finalGapX(isRight, srcMc, dstMc, gapRect);
    const { svg, xOff } = makeSpanSVG(gap, gapRect, fromX, toX);

    path(svg, fromX - xOff, srcY, xMid - xOff, srcY, xMid - xOff, dstY, toX - xOff, dstY, HYPO_LINE_COLOR, 2);
  });
}

function drawAllLines() {
  const el = document.getElementById('bracket');
  const spread = 2.5;

  el.querySelectorAll('.gap-col').forEach(gap => {
    const side = gap.dataset.side, ri = parseInt(gap.dataset.ri), prevRi = ri-1;
    const isRight = side==='right';
    const gapRect = gap.getBoundingClientRect();
    const { svg } = makeSVG(gap, gapRect);
    const x0=0, x1=gapRect.width, xMid=gapRect.width/2;
    const fromX = isRight?x1:x0, toX = isRight?x0:x1;

    for (let mi=0; mi<COUNTS_SIDE[ri]; mi++) {
      const dstSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${ri}"][data-mi="${mi}"]`);
      if (!dstSlot) continue;
      const dstMcs = dstSlot.querySelectorAll('.mc');
      if (dstMcs.length < 2) continue;
      const dstY0 = midY(dstMcs[0], gapRect), dstY1 = midY(dstMcs[1], gapRect);

      [0,1].forEach(arm => {
        const srcMi = mi*2+arm, dstY = arm===0?dstY0:dstY1;

        // Only draw a line if the ACTUAL RESULT has a winner for this source match
        const rm = results[side][prevRi][srcMi];
        if (rm.winner === null) return;
        const actualWinnerName = rm.teams[rm.winner].name;

        const srcSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${prevRi}"][data-mi="${srcMi}"]`);
        if (!srcSlot) return;
        const srcMcs = srcSlot.querySelectorAll('.mc');
        if (!srcMcs[rm.winner]) return;
        const srcY = midY(srcMcs[rm.winner], gapRect);

        // Find every bracket that also picked the actual winner for this match
        const pickers = brackets.filter(b => getBracketWinner(b.data, side, prevRi, srcMi) === actualWinnerName);
        if (!pickers.length) return;

        const totalOff = (pickers.length - 1) * spread;
        pickers.forEach((b, i) => {
          const off = -totalOff/2 + i*spread;
          path(svg, fromX, srcY+off, xMid, srcY+off, xMid, dstY+off, toX, dstY+off, strokeColor(b.color), 2);
        });
      });
    }
  });

  // Final gaps
  el.querySelectorAll('.final-gap').forEach(gap => {
    const side = gap.dataset.side, isRight = side==='right';
    const sfRi = COUNTS_SIDE.length-1;
    const gapRect = gap.getBoundingClientRect();
    const finalTi = side==='left'?0:1;

    const sfSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${sfRi}"][data-mi="0"]`);
    const finalMcs = document.querySelectorAll('#final-match > .mc');
    if (!sfSlot || !finalMcs[finalTi]) return;
    const sfMcs = sfSlot.querySelectorAll('.mc');

    // Only draw if actual result has a SF winner
    const rm = results[side][sfRi][0];
    if (rm.winner === null || !sfMcs[rm.winner]) return;
    const actualWinnerName = rm.teams[rm.winner].name;
    const srcMc = sfMcs[rm.winner];
    const dstMc = finalMcs[finalTi];
    const srcY = midY(srcMc, gapRect);
    const dstY = midY(dstMc, gapRect);
    const { fromX, toX, xMid } = finalGapX(isRight, srcMc, dstMc, gapRect);
    const { svg, xOff } = makeSpanSVG(gap, gapRect, fromX, toX);

    const pickers = brackets.filter(b => getBracketWinner(b.data, side, sfRi, 0) === actualWinnerName);
    if (!pickers.length) return;

    const totalOff = (pickers.length - 1) * spread;
    pickers.forEach((b, i) => {
      const off = -totalOff/2 + i*spread;
      path(svg, fromX - xOff, srcY + off, xMid - xOff, srcY + off, xMid - xOff, dstY + off, toX - xOff, dstY + off, strokeColor(b.color), 2);
    });
  });
}

function midY(el, gapRect) { const r=el.getBoundingClientRect(); return (r.top+r.bottom)/2-gapRect.top; }
function mcEdgeX(el, gapRect, edge) {
  const r = el.getBoundingClientRect();
  return (edge === 'left' ? r.left : r.right) - gapRect.left;
}
function makeSVG(gap, gapRect) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width', gapRect.width); svg.setAttribute('height', gapRect.height);
  Object.assign(svg.style,{position:'absolute',top:'0',left:'0',overflow:'visible'});
  gap.innerHTML=''; gap.appendChild(svg); return { svg, xOff: 0 };
}
function makeSpanSVG(gap, gapRect, fromX, toX) {
  const minX = Math.min(fromX, toX, 0);
  const maxX = Math.max(fromX, toX, gapRect.width);
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width', maxX - minX);
  svg.setAttribute('height', gapRect.height);
  Object.assign(svg.style,{position:'absolute',top:'0',left:minX+'px',overflow:'visible'});
  gap.innerHTML=''; gap.appendChild(svg);
  return { svg, xOff: minX };
}
function finalGapX(isRight, srcMc, dstMc, gapRect) {
  const fromX = mcEdgeX(srcMc, gapRect, isRight ? 'left' : 'right');
  const toX = mcEdgeX(dstMc, gapRect, isRight ? 'right' : 'left');
  return { fromX, toX, xMid: (fromX + toX) / 2 };
}
// Draw a connected elbow path: fromX,y1 → x2,y1 → x2,y3 → toX,y3
function path(svg, fromX, y1, x2, _y1, _x2, y3, toX, _y3, stroke, w) {
  const p = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  p.setAttribute('points', `${fromX},${y1} ${x2},${y1} ${x2},${y3} ${toX},${y3}`);
  p.setAttribute('stroke', stroke);
  p.setAttribute('stroke-width', w);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(p);
}
function line(svg,x1,y1,x2,y2,stroke,w) {
  if (Math.abs(x1-x2)<0.1&&Math.abs(y1-y2)<0.1) return;
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
  l.setAttribute('stroke',stroke);l.setAttribute('stroke-width',w);l.setAttribute('stroke-linecap','round');
  svg.appendChild(l);
}

// ── IMPORT / AUTO-LOAD ───────────────────────────────────────────────────────
const BRACKET_DIR = 'brackets/';
const ACTUAL_FILE = 'actual';

function manifestFile() {
  const param = new URLSearchParams(location.search).get('manifest');
  if (param === 'local') return 'manifest.local.json';
  if (param === 'prod') return 'manifest.json';
  const host = location.hostname;
  if (host === 'localhost' || host === '127.0.0.1') return 'manifest.local.json';
  return 'manifest.json';
}

async function loadActualResults() {
  try {
    const res = await fetch(BRACKET_DIR + ACTUAL_FILE);
    if (!res.ok) throw new Error('actual');
    applyActualData(await res.json());
  } catch {
    results = buildResults();
    showToast('Could not load brackets/actual');
  }
}

function addBracketFromData(data, fallbackName) {
  if (!data.left || !data.right || !data.final) throw new Error('Invalid bracket');
  const name = data.bracketName || fallbackName || `Bracket ${brackets.length + 1}`;
  const color = PALETTE[nextColorIdx % PALETTE.length];
  nextColorIdx++;
  brackets.push({ id: Date.now() + nextColorIdx, name, color, data });
  return name;
}

async function loadAllBrackets() {
  brackets = [];
  nextColorIdx = 0;
  renderBracket();
  const bar = document.getElementById('legendBar');
  if (bar) bar.innerHTML = '<span class="legend-empty">Loading brackets…</span>';

  try {
    await loadActualResults();

    const manifestRes = await fetch(BRACKET_DIR + manifestFile());
    if (!manifestRes.ok) throw new Error('manifest');
    const files = (await manifestRes.json()).filter(f => f !== ACTUAL_FILE);

    const loaded = await Promise.all(files.map(async (file) => {
      const res = await fetch(BRACKET_DIR + encodeURIComponent(file));
      if (!res.ok) throw new Error(file);
      return { file, data: await res.json() };
    }));

    for (const { file, data } of loaded) {
      try { addBracketFromData(data, file); } catch {}
    }

    render();
    if (brackets.length) showToast(`Loaded ${brackets.length} brackets`);
  } catch {
    await loadActualResults();
    render();
    const bar = document.getElementById('legendBar');
    if (location.protocol === 'file:') {
      bar.innerHTML = '<span class="legend-empty">Auto-load needs a local server — run <code>python3 -m http.server</code> in this folder, or use "+ Add bracket"</span>';
    } else if (!brackets.length) {
      bar.innerHTML = '<span class="legend-empty">No brackets loaded — click "+ Add bracket" to start</span>';
    }
  }
}

function openImportModal() {
  document.getElementById('importPaste').value='';
  document.getElementById('fileName').textContent='';
  document.getElementById('importModal').classList.add('open');
  setTimeout(()=>document.getElementById('importPaste').focus(),50);
}
function closeImportModal() { document.getElementById('importModal').classList.remove('open'); }
function onFilePicked(e) {
  const file=e.target.files[0]; if(!file) return;
  document.getElementById('fileName').textContent=file.name;
  const reader=new FileReader();
  reader.onload=ev=>{document.getElementById('importPaste').value=ev.target.result;};
  reader.readAsText(file); e.target.value='';
}
function confirmImport() {
  const text=document.getElementById('importPaste').value.trim();
  if(!text){showToast('Paste JSON or choose a file');return;}
  try {
    const name=addBracketFromData(JSON.parse(text));
    closeImportModal(); render();
    showToast(`${name} added!`);
  } catch { showToast('Invalid JSON — check and try again'); }
}
function clearBrackets() { brackets=[]; nextColorIdx=0; viewingBracketIdx=null; render(); showToast('Brackets cleared'); }

function downloadSnapshot() {
  // Get current page HTML, inject the live state so it renders the same when opened
  let html = document.documentElement.outerHTML;
  // Replace the buildState/loadState init with hardcoded frozen state
  const frozenState = JSON.stringify({ results, brackets, nextColorIdx, viewingBracketIdx });
  const injection = `<script>
(function() {
  const frozen = ${frozenState};
  results = frozen.results;
  brackets = frozen.brackets;
  nextColorIdx = frozen.nextColorIdx;
  viewingBracketIdx = frozen.viewingBracketIdx ?? null;
  document.addEventListener('DOMContentLoaded', () => render());
})();
<\/script>`;
  // Inject just before </body>
  html = html.replace('</body>', injection + '</body>');
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wc2026_scorer_snapshot.html';
  a.click();
  showToast('Snapshot downloaded!');
}

document.getElementById('importModal').addEventListener('click',e=>{if(e.target===document.getElementById('importModal'))closeImportModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImportModal();});

let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
window.addEventListener('resize', () => requestAnimationFrame(drawLines));
loadAllBrackets();
</script>
