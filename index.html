<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Bracket Scorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg:      #12151c;
    --surface: #1e2433;
    --border:  #3a4254;
    --text:    #e8ecf1;
    --muted:   #9aa3b5;
    --accent:  #4d9bff;
    --CARD-H:  38px;
    --GAP-W:   28px;
    --LOGO-H:  155px;
    --LOGO-SPILL: 72px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: auto; }

  .bracket-fit {
    display: grid;
    grid-template-columns: auto auto var(--GAP-W) auto var(--GAP-W) auto auto;
    grid-template-rows: minmax(min-content, 1fr);
    width: max-content;
    margin: 0 auto;
    overflow: visible;
    flex: 1 0 auto;
    min-height: calc(100vh - 20px);
    align-content: stretch;
  }
  #bracket { display: contents; }
  #bracket > .half-early.left { grid-column: 1; grid-row: 1; align-self: stretch; }
  #bracket > .half-sf.left { grid-column: 2; grid-row: 1; align-self: stretch; }
  #bracket > .final-gap[data-side="left"] { grid-column: 3; grid-row: 1; align-self: stretch; }
  #bracket > .center-col { grid-column: 4; grid-row: 1; align-self: stretch; }
  #bracket > .final-gap[data-side="right"] { grid-column: 5; grid-row: 1; align-self: stretch; }
  #bracket > .half-sf.right { grid-column: 6; grid-row: 1; align-self: stretch; }
  #bracket > .half-early.right { grid-column: 7; grid-row: 1; align-self: stretch; }
  .rankings-section {
    grid-column: 2 / 7;
    grid-row: 1;
    align-self: end;
    background: var(--bg);
    position: relative;
    z-index: 2;
  }

  .btn { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; transition: all .15s; }
  .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { background: var(--accent); color: #fff; font-weight: 700; }
  .btn-accent:hover { background: #3a85e0; color: #fff; }

  /* Leaderboard (below SF) */
  .leaderboard-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--accent); text-align: center; padding: 0 0 6px; }
  .leaderboard-panel { width: 100%; padding-top: 0; }
  .leaderboard { display: flex; flex-direction: column; gap: 3px; width: 100%; }
  .lb-row { display: grid; grid-template-columns: 14px 8px minmax(0, 0.45fr) minmax(48px, 1fr) 46px; gap: 4px; align-items: center; }
  .lb-rank {
    font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700;
    font-variant-numeric: tabular-nums; text-align: right; color: var(--muted);
  }
  .lb-rank.gold   { color: #f5c518; }
  .lb-rank.silver { color: #adb5bd; }
  .lb-rank.bronze { color: #cd7f32; }
  .lb-dot  { width: 8px; height: 8px; border-radius: 1px; flex-shrink: 0; }
  .lb-name {
    font-size: 9px; font-weight: 600; color: var(--text);
    line-height: 1.15; cursor: pointer; min-width: 0;
  }
  .lb-name:hover { color: var(--accent); }
  .lb-row.active .lb-name { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .lb-back-btn {
    display: block; width: 100%; margin-bottom: 4px;
    font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 600;
    letter-spacing: 0.4px; text-transform: uppercase;
    padding: 3px 6px; border-radius: 3px;
    border: 1px solid var(--accent); background: transparent;
    color: var(--accent); cursor: pointer;
  }
  .lb-back-btn:hover { background: var(--accent); color: #fff; }
  .lb-bar-track {
    position: relative;
    height: 12px;
    background: #2a3142;
    border: 1px solid #4a5568;
    border-radius: 1px;
    overflow: hidden;
  }
  .lb-bar-track::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(25% - 0.5px),
      rgba(255, 255, 255, 0.08) calc(25% - 0.5px),
      rgba(255, 255, 255, 0.08) 25%
    );
    pointer-events: none;
  }
  .lb-bar-fill {
    position: relative;
    z-index: 1;
    height: 100%;
    min-width: 2px;
    border-radius: 0 1px 1px 0;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-left: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: width 0.35s ease;
  }
  .lb-score {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    text-align: right;
    white-space: nowrap;
  }
  .lb-max { font-size: 8px; font-weight: 600; color: var(--muted); }
  .legend-empty { color: var(--muted); font-style: italic; font-size: 9px; }

  /* Bracket layout — stretch to fill viewport, never shrink below content */
  .bracket-scroll {
    padding: 10px 16px 10px 20px;
    overflow-x: auto;
    position: relative;
    z-index: 1;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .half { display: flex; align-items: stretch; height: 100%; min-height: min-content; }
  .half-early { display: flex; align-items: stretch; height: 100%; min-height: min-content; }
  .half-sf { display: flex; align-items: stretch; height: 100%; min-height: min-content; }

  .round-col { display: flex; flex-direction: column; width: max-content; min-width: 80px; flex-shrink: 0; align-self: stretch; height: 100%; min-height: min-content; }
  .round-label { font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--accent); text-align: center; padding: 3px 0 8px; flex-shrink: 0; }
  .round-slots { display: flex; flex-direction: column; flex: 1 0 auto; min-height: min-content; }
  .team-slot { display: flex; flex-direction: column; justify-content: center; flex: 1 1 auto; min-height: min-content; }

  .match-pair { display: flex; flex-direction: column; width: 100%; flex-shrink: 0; }

  /* Team row */
  .mc {
    display: flex; flex-direction: column;
    padding: 0;
    background: var(--surface); border: 1.5px solid var(--border);
    user-select: none; width: 100%;
  }
  .mc:first-child { border-radius: 4px 4px 0 0; border-bottom: none; }
  .mc:last-child  { border-radius: 0 0 4px 4px; }
  .mc.actual-win { background: #14532d; border-color: #22c55e; }
  .mc.actual-loss { background: #450a0a; border-color: #ef4444; }
  .mc.actual-pickable { cursor: pointer; }
  .mc.actual-pickable:hover { border-color: var(--accent); background: #252b3a; }
  .mc.actual-clearable { cursor: pointer; }
  .mc.actual-clearable:hover { border-color: var(--accent); }
  .mc.actual-decided { cursor: default; }
  .mc.actual-locked { cursor: default; }
  .mc.hypo-win     { background: #14532d; border-color: #22c55e; }
  .mc.hypo-correct { background: #22c55e; border-color: #4ade80; color: #fff; }
  .mc.hypo-correct .tname { color: #fff; }
  .mc.hypo-loss { background: #450a0a; border-color: #ef4444; }
  .mc.tbd { cursor: default; opacity: 0.35; }
  .mc.tbd:hover { border-color: var(--border); }

  /* Team name row inside the card */
  .mc-content { display: flex; align-items: center; gap: 5px; width: 100%; padding: 8px 8px 2px; }

  /* Dot row inside the card, below the team name */
  .dot-row { display: flex; flex-direction: row; gap: 3px; padding: 0 8px 5px; }
  .pick-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .flag { font-size: 18px; line-height: 1; flex-shrink: 0; }
  .tname { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; color: var(--text); flex: 1; }
  .pick-check { font-size: 9px; color: #9ca3af; flex-shrink: 0; }
  .match-date { font-size:9px; color:var(--muted); letter-spacing:0.3px; text-align:center; padding:2px 0 2px; opacity:0.8; }
  .match-date.today { color: #fb923c; opacity: 1; font-weight: 600; }
  .match-pair.today,
  .match-block.today { outline: 2.5px solid #fb923c; outline-offset: 2px; border-radius: 5px; }

  /* Gap cols */
  .gap-col, .final-gap { flex-shrink: 0; position: relative; overflow: visible; align-self: stretch; }
  .gap-col { width: var(--GAP-W); }
  .final-gap { width: var(--GAP-W); }
  .gap-col svg, .final-gap svg { position: absolute; top: 0; left: 0; overflow: visible; }

  /* Center — 3 zones: final above SF, champ aligned with SF, third below SF */
  .center-col {
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    align-items: center;
    justify-items: center;
    width: max-content;
    flex-shrink: 0;
    padding: 0 8px;
    align-self: stretch;
    min-height: min-content;
    overflow: visible;
  }
  .bracket-title {
    grid-row: 1;
    grid-column: 1;
    align-self: start;
    justify-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: calc(100% + 2 * var(--LOGO-SPILL));
    margin: 0 calc(-1 * var(--LOGO-SPILL));
    line-height: 0;
    position: relative;
    z-index: 2;
  }
  .bracket-title img { width: 100%; height: var(--LOGO-H); object-fit: contain; display: block; }
  .center-final {
    grid-row: 1;
    grid-column: 1;
    align-self: end;
    justify-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  .champ-card {
    grid-row: 2;
    grid-column: 1;
    background: linear-gradient(145deg,#1a2e1f,#152418);
    border: 2px solid #22c55e;
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 0 20px rgba(34,197,94,0.2);
    width: 100%;
  }
  .center-third {
    grid-row: 3;
    grid-column: 1;
    align-self: start;
    justify-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding-top: 10px;
  }
  .center-label { font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--accent); text-align: center; padding: 3px 0 8px; border-bottom: 1px solid var(--border); width: 100%; margin-bottom: 10px; align-self: stretch; }
  .champ-trophy { font-size: 26px; }
  .champ-flag   { font-size: 22px; margin-top: 5px; }
  .champ-name   { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: #4ade80; margin-top: 3px; }
  .champ-empty  { font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.4; }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 22px; width: 400px; max-width: 94vw; }
  .modal h3 { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--accent); margin-bottom: 4px; }
  .modal p  { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .modal textarea { width: 100%; background: #0d1117; border: 1.5px solid var(--border); border-radius: 4px; color: var(--text); font-family: monospace; font-size: 11px; padding: 8px 10px; outline: none; margin-bottom: 10px; resize: vertical; }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
</style>
</head>
<body>

<div class="bracket-scroll">
  <div class="bracket-fit" id="bracketFit">
    <div id="bracket"></div>
    <div class="rankings-section">
      <div class="leaderboard-title" id="lbTitle">Rankings</div>
      <div class="leaderboard-panel" id="legendBar"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="importModal">
  <div class="modal">
    <h3>Add bracket</h3>
    <p>Paste JSON or choose a file — the name is read from the bracket automatically.</p>
    <textarea id="importPaste" rows="5" placeholder="Paste bracket JSON here…"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
      <button class="btn btn-ghost" style="font-size:11px;" onclick="document.getElementById('fileInput').click()">📁 Choose file</button>
      <span id="fileName" style="font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeImportModal()">Cancel</button>
      <button class="btn btn-accent" onclick="confirmImport()">Add</button>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="onFilePicked(event)">

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const PALETTE = [
  // normal — 6 distinct hues
  '#E6194B', '#3CB44B', '#4363D8', '#F58231', '#911EB4', '#42D4F4',
  // light — 6 different hues (not tints of the above)
  '#FFE119', '#F032E6', '#BFEF45', '#FABED4', '#DCBEFF', '#FFFFFF',
  // dark — 6 different hues + black
  '#000000', '#469990', '#9A6324', '#800000', '#000075', '#808080',
];

function needsColorBorder(color) {
  const c = color.toLowerCase();
  return c === '#ffffff' || c === '#fff';
}

function colorBgStyle(color) {
  return needsColorBorder(color)
    ? `background:${color};border:1.5px solid #374151;`
    : `background:${color};`;
}

function strokeColor(color) {
  return needsColorBorder(color) ? '#374151' : color;
}

const TEAM_META = {
  "South Africa":  { flag:"🇿🇦", abbr:"RSA" }, "Canada":           { flag:"🇨🇦", abbr:"CAN" },
  "Netherlands":   { flag:"🇳🇱", abbr:"NED" }, "Morocco":          { flag:"🇲🇦", abbr:"MAR" },
  "Germany":       { flag:"🇩🇪", abbr:"GER" }, "Paraguay":         { flag:"🇵🇾", abbr:"PAR" },
  "France":        { flag:"🇫🇷", abbr:"FRA" }, "Sweden":           { flag:"🇸🇪", abbr:"SWE" },
  "Belgium":       { flag:"🇧🇪", abbr:"BEL" }, "Senegal":          { flag:"🇸🇳", abbr:"SEN" },
  "USA":           { flag:"🇺🇸", abbr:"USA" }, "Bosnia & Hz":      { flag:"🇧🇦", abbr:"BIH" },
  "Spain":         { flag:"🇪🇸", abbr:"ESP" }, "Austria":          { flag:"🇦🇹", abbr:"AUT" },
  "Portugal":      { flag:"🇵🇹", abbr:"POR" }, "Croatia":          { flag:"🇭🇷", abbr:"CRO" },
  "Brazil":        { flag:"🇧🇷", abbr:"BRA" }, "Japan":            { flag:"🇯🇵", abbr:"JPN" },
  "Côte d'Ivoire": { flag:"🇨🇮", abbr:"CIV" }, "Norway":           { flag:"🇳🇴", abbr:"NOR" },
  "Mexico":        { flag:"🇲🇽", abbr:"MEX" }, "Ecuador":          { flag:"🇪🇨", abbr:"ECU" },
  "England":       { flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", abbr:"ENG" }, "DR Congo":        { flag:"🇨🇩", abbr:"COD" },
  "Switzerland":   { flag:"🇨🇭", abbr:"SUI" }, "Algeria":          { flag:"🇩🇿", abbr:"ALG" },
  "Colombia":      { flag:"🇨🇴", abbr:"COL" }, "Ghana":            { flag:"🇬🇭", abbr:"GHA" },
  "Australia":     { flag:"🇦🇺", abbr:"AUS" }, "Egypt":            { flag:"🇪🇬", abbr:"EGY" },
  "Argentina":     { flag:"🇦🇷", abbr:"ARG" }, "Cabo Verde":       { flag:"🇨🇻", abbr:"CPV" },
};
const R32_LEFT  = [["South Africa","Canada"],["Netherlands","Morocco"],["Germany","Paraguay"],["France","Sweden"],["Belgium","Senegal"],["USA","Bosnia & Hz"],["Spain","Austria"],["Portugal","Croatia"]];
const R32_RIGHT = [["Brazil","Japan"],["Côte d'Ivoire","Norway"],["Mexico","Ecuador"],["England","DR Congo"],["Switzerland","Algeria"],["Colombia","Ghana"],["Australia","Egypt"],["Argentina","Cabo Verde"]];
const COUNTS_SIDE  = [8, 4, 2, 1];

const R32_SCHEDULE = {
  left:  ["Jun 28, 12pm","Jun 29, 6pm","Jun 29, 1:30pm","Jun 30, 2pm","Jul 1, 1pm","Jul 1, 5pm","Jul 2, 12pm","Jul 2, 4pm"],
  right: ["Jun 29, 10am","Jun 30, 10am","Jun 30, 6pm","Jul 1, 9am","Jul 2, 8pm","Jul 3, 6:30pm","Jul 3, 11am","Jul 3, 3pm"],
};

// R16: left pairs (mi=0..3), right pairs (mi=0..3) — all PT
const R16_SCHEDULE = {
  left:  ["Jul 4, 10am","Jul 4, 2pm","Jul 6, 5pm","Jul 6, 12pm"],
  right: ["Jul 5, 1pm","Jul 5, 5pm","Jul 7, 1pm","Jul 7, 9am"],
};

// QF: left (mi=0..1), right (mi=0..1) — all PT
const QF_SCHEDULE = {
  left:  ["Jul 9, 1pm","Jul 10, 12pm"],
  right: ["Jul 11, 2pm","Jul 11, 6pm"],
};

// SF: left (mi=0), right (mi=0) — all PT
const SF_SCHEDULE = {
  left:  ["Jul 14, 12pm"],
  right: ["Jul 15, 12pm"],
};

const FINAL_SCHEDULE   = "Jul 19, 12pm PT";
const THIRD_SCHEDULE   = "Jul 18, 2pm PT";
const WC_YEAR = 2026;
const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };

function isScheduleToday(schedStr) {
  const m = schedStr.match(/^([A-Za-z]+)\s+(\d+)/);
  if (!m) return false;
  const month = MONTHS[m[1]];
  if (month === undefined) return false;
  const gameDay = new Date(WC_YEAR, month, parseInt(m[2], 10));
  gameDay.setHours(0, 0, 0, 0);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return gameDay.getTime() === today.getTime();
}

function flag(name) { return (TEAM_META[name]||{}).flag||''; }
function abbr(name) { return (TEAM_META[name]||{}).abbr||name.slice(0,3).toUpperCase(); }
function tbd()      { return { name:"TBD", flag:"", abbr:"" }; }
function makeTeam(name) { return { name, flag:flag(name), abbr:abbr(name) }; }

// ── STATE ────────────────────────────────────────────────────────────────────
// `results` loaded from brackets/actual — participant brackets scored against it

function buildResults() {
  const make = (side, pairs) => COUNTS_SIDE.map((count, ri) =>
    Array.from({ length: count }, (_, mi) =>
      ri === 0
        ? { teams: [makeTeam(pairs[mi][0]), makeTeam(pairs[mi][1])], winner: null }
        : { teams: [tbd(), tbd()], winner: null }
    )
  );
  return {
    left:     make('left',  R32_LEFT),
    right:    make('right', R32_RIGHT),
    final:    { teams: [tbd(), tbd()], winner: null },
    third:    { teams: [tbd(), tbd()], winner: null },
    champion: null,
  };
}

let results  = buildResults();
let brackets = [];
let nextColorIdx = 0;
let viewingBracketIdx = null;
const userActualPicks = new Set();
const fileActualDecided = new Set();
const fileActualWinners = new Map();

function actualPickKey(side, ri, mi) {
  if (side === 'final') return 'final';
  if (side === 'third') return 'third';
  return `${side}:${ri}:${mi}`;
}

function pruneUserActualPicks() {
  for (const key of [...userActualPicks]) {
    let match;
    if (key === 'final') match = results.final;
    else if (key === 'third') match = results.third;
    else {
      const [side, ri, mi] = key.split(':');
      match = results[side][+ri][+mi];
    }
    if (!match || match.winner === null) userActualPicks.delete(key);
  }
}

function bracketDisplayData() {
  if (viewingBracketIdx === null) return results;
  const d = brackets[viewingBracketIdx].data;
  return {
    ...d,
    third: d.third || { teams: [tbd(), tbd()], winner: null },
    champion: d.champion ?? (
      d.final && d.final.winner !== null && d.final.winner !== undefined
        ? d.final.teams[d.final.winner]
        : null
    ),
  };
}

function showActualBracket() {
  viewingBracketIdx = null;
  render();
}

function showBracket(idx) {
  if (idx < 0 || idx >= brackets.length) return;
  viewingBracketIdx = idx;
  render();
}

function mcClasses(displayMatch, ti, actualMatch, hypothetical, pickKey, side, ri) {
  const team = displayMatch.teams[ti];
  if (team.name === 'TBD') return 'mc tbd';
  if (!hypothetical) {
    if (viewingBracketIdx === null && displayMatch.winner !== null) {
      if (pickKey && userActualPicks.has(pickKey)) {
        return 'mc actual-decided' + (displayMatch.winner === ti ? ' actual-win' : ' actual-loss');
      }
      return 'mc actual-decided' + (pickKey && fileActualDecided.has(pickKey) ? ' actual-locked' : '');
    }
    let cls = 'mc';
    if (viewingBracketIdx === null && pickKey) {
      if (isActualTeamPickable(displayMatch, ti, pickKey)) cls += ' actual-pickable';
    }
    if (viewingBracketIdx === null && pickKey && fileActualDecided.has(pickKey)) cls += ' actual-locked';
    return cls;
  }
  if (displayMatch.winner === null) return 'mc';
  if (displayMatch.winner === ti) {
    if (actualMatch?.winner !== null) {
      const pickName = displayMatch.teams[displayMatch.winner].name;
      const actualName = actualMatch.teams[actualMatch.winner].name;
      if (pickName === actualName) return 'mc hypo-correct';
    }
    return 'mc hypo-win';
  }
  return 'mc hypo-loss';
}

function recordFileDecided(data) {
  fileActualDecided.clear();
  fileActualWinners.clear();
  ['left', 'right'].forEach(side => {
    COUNTS_SIDE.forEach((count, ri) => {
      for (let mi = 0; mi < count; mi++) {
        const m = data[side]?.[ri]?.[mi];
        if (m && m.winner !== null && m.winner !== undefined) {
          const key = actualPickKey(side, ri, mi);
          fileActualDecided.add(key);
          fileActualWinners.set(key, m.winner);
        }
      }
    });
  });
  if (data.final?.winner !== null && data.final?.winner !== undefined) {
    fileActualDecided.add('final');
    fileActualWinners.set('final', data.final.winner);
  }
  if (data.third?.winner !== null && data.third?.winner !== undefined) {
    fileActualDecided.add('third');
    fileActualWinners.set('third', data.third.winner);
  }
}

function restoreFileDecidedWinners() {
  for (const [key, winner] of fileActualWinners) {
    if (key === 'final') {
      const m = results.final;
      if (m.teams[0].name !== 'TBD' && m.teams[1].name !== 'TBD') {
        m.winner = winner;
        results.champion = copyTeam(m.teams[winner]);
      }
    } else if (key === 'third') {
      const m = results.third;
      if (m.teams[0].name !== 'TBD' && m.teams[1].name !== 'TBD') m.winner = winner;
    } else {
      const [side, ri, mi] = key.split(':');
      const m = results[side][+ri][+mi];
      if (m && m.teams[0].name !== 'TBD' && m.teams[1].name !== 'TBD') m.winner = winner;
    }
  }
}

function applyActualData(data) {
  if (!data.left || !data.right || !data.final) throw new Error('Invalid actual bracket');
  results = {
    left: data.left,
    right: data.right,
    final: data.final,
    third: data.third || { teams: [tbd(), tbd()], winner: null },
    champion: data.champion ?? (
      data.final.winner !== null && data.final.winner !== undefined
        ? data.final.teams[data.final.winner]
        : null
    ),
  };
  userActualPicks.clear();
  recordFileDecided(data);
  syncResultsBracket();
}

// ── ACTUAL BRACKET SYNC & PICKING ────────────────────────────────────────────

function copyTeam(team) {
  if (!team || team.name === 'TBD') return tbd();
  return { name: team.name, flag: team.flag || flag(team.name), abbr: team.abbr || abbr(team.name), ...(team.iso ? { iso: team.iso } : {}) };
}

function winnerTeam(match) {
  if (!match || match.winner === null || match.winner === undefined) return null;
  return match.teams[match.winner];
}

function loserTeam(match) {
  if (!match || match.winner === null || match.winner === undefined) return null;
  return match.teams[match.winner === 0 ? 1 : 0];
}

function syncResultsBracket() {
  ['left', 'right'].forEach(side => {
    for (let ri = 1; ri < COUNTS_SIDE.length; ri++) {
      for (let mi = 0; mi < COUNTS_SIDE[ri]; mi++) {
        const match = results[side][ri][mi];
        const t0 = winnerTeam(results[side][ri - 1][mi * 2]);
        const t1 = winnerTeam(results[side][ri - 1][mi * 2 + 1]);
        match.teams[0] = copyTeam(t0);
        match.teams[1] = copyTeam(t1);
        const key = actualPickKey(side, ri, mi);
        const oneTbd = !t0 || !t1 || t0.name === 'TBD' || t1.name === 'TBD';
        if (oneTbd) {
          if (userActualPicks.has(key)) {
            if (match.winner !== null) {
              const w = match.teams[match.winner];
              if (!w || w.name === 'TBD') match.winner = null;
            }
          } else {
            match.winner = null;
          }
        }
      }
    }
  });

  const leftSF = results.left[COUNTS_SIDE.length - 1][0];
  const rightSF = results.right[COUNTS_SIDE.length - 1][0];
  const leftW = winnerTeam(leftSF);
  const rightW = winnerTeam(rightSF);
  results.final.teams[0] = copyTeam(leftW);
  results.final.teams[1] = copyTeam(rightW);
  const finalOneTbd = !leftW || !rightW || leftW.name === 'TBD' || rightW.name === 'TBD';
  if (finalOneTbd) {
    if (userActualPicks.has('final')) {
      if (results.final.winner !== null) {
        const w = results.final.teams[results.final.winner];
        if (!w || w.name === 'TBD') {
          results.final.winner = null;
          results.champion = null;
        } else {
          results.champion = copyTeam(w);
        }
      }
    } else {
      results.final.winner = null;
      results.champion = null;
    }
  } else if (results.final.winner !== null) {
    results.champion = copyTeam(results.final.teams[results.final.winner]);
  } else {
    results.champion = null;
  }

  const leftL = loserTeam(leftSF);
  const rightL = loserTeam(rightSF);
  results.third.teams[0] = copyTeam(leftL);
  results.third.teams[1] = copyTeam(rightL);
  const thirdOneTbd = !leftL || !rightL || leftL.name === 'TBD' || rightL.name === 'TBD';
  if (thirdOneTbd) {
    if (userActualPicks.has('third')) {
      if (results.third.winner !== null) {
        const w = results.third.teams[results.third.winner];
        if (!w || w.name === 'TBD') results.third.winner = null;
      }
    } else {
      results.third.winner = null;
    }
  }
  restoreFileDecidedWinners();
  pruneUserActualPicks();
}

function isActualMatchPickable(match, pickKey) {
  if (pickKey && fileActualDecided.has(pickKey)) return false;
  return match.winner === null && (
    match.teams[0].name !== 'TBD' || match.teams[1].name !== 'TBD'
  );
}

function isActualTeamPickable(match, ti, pickKey) {
  if (pickKey && fileActualDecided.has(pickKey)) return false;
  return match.winner === null && match.teams[ti].name !== 'TBD';
}

function isActualFinalPickable() {
  if (fileActualDecided.has('final')) return false;
  return isActualMatchPickable(results.final, 'final');
}

function isActualThirdPickable() {
  if (fileActualDecided.has('third')) return false;
  return isActualMatchPickable(results.third, 'third');
}

function isActualMatchClearable(match, pickKey) {
  return pickKey
    && userActualPicks.has(pickKey)
    && !fileActualDecided.has(pickKey)
    && match.winner !== null
    && (match.teams[0].name !== 'TBD' || match.teams[1].name !== 'TBD');
}

function attachActualPick(mc, match, ti, pickKey, pickFn, clearFn) {
  if (viewingBracketIdx !== null || fileActualDecided.has(pickKey)) return;
  if (isActualTeamPickable(match, ti, pickKey)) {
    mc.classList.add('actual-pickable');
    mc.onclick = (e) => { e.stopPropagation(); pickFn(ti); };
  } else if (match.winner === ti && isActualMatchClearable(match, pickKey)) {
    mc.classList.add('actual-clearable');
    mc.onclick = (e) => { e.stopPropagation(); clearFn(); };
  }
}

function clearActualSide(side, ri, mi) {
  const key = actualPickKey(side, ri, mi);
  const match = results[side][ri][mi];
  if (!isActualMatchClearable(match, key)) return;
  match.winner = null;
  userActualPicks.delete(key);
  syncResultsBracket();
  render();
  showToast('Result cleared');
}

function pickActualSide(side, ri, mi, ti) {
  const key = actualPickKey(side, ri, mi);
  const match = results[side][ri][mi];
  if (fileActualDecided.has(key) || !isActualTeamPickable(match, ti, key)) return;
  match.winner = ti;
  userActualPicks.add(key);
  syncResultsBracket();
  render();
  showToast(`${match.teams[ti].name} wins`);
}

function clearActualFinal() {
  if (!isActualMatchClearable(results.final, 'final')) return;
  results.final.winner = null;
  results.champion = null;
  userActualPicks.delete('final');
  pruneUserActualPicks();
  render();
  showToast('Final result cleared');
}

function pickActualFinal(ti) {
  if (fileActualDecided.has('final') || !isActualTeamPickable(results.final, ti, 'final')) return;
  results.final.winner = ti;
  results.champion = copyTeam(results.final.teams[ti]);
  userActualPicks.add('final');
  render();
  showToast(`${results.final.teams[ti].name} wins the Final`);
}

function clearActualThird() {
  if (!isActualMatchClearable(results.third, 'third')) return;
  results.third.winner = null;
  userActualPicks.delete('third');
  render();
  showToast('3rd place result cleared');
}

function pickActualThird(ti) {
  if (fileActualDecided.has('third') || !isActualTeamPickable(results.third, ti, 'third')) return;
  results.third.winner = ti;
  userActualPicks.add('third');
  render();
  showToast(`${results.third.teams[ti].name} takes 3rd`);
}

function downloadActual() {
  const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'actual';
  a.click();
  showToast('Downloaded actual');
}

// ── BRACKET QUERY HELPERS ────────────────────────────────────────────────────
function getBracketWinner(bData, side, ri, mi) {
  try { const m = bData[side][ri][mi]; return m.winner !== null ? m.teams[m.winner].name : null; }
  catch { return null; }
}
function getBracketFinalWinner(bData) {
  try { const m = bData.final; return m.winner !== null ? m.teams[m.winner].name : null; }
  catch { return null; }
}

// Which brackets picked `teamName` as winner of (side, ri, mi)?
function bracketsPickedWinner(side, ri, mi, teamName) {
  return brackets.filter(b => getBracketWinner(b.data, side, ri, mi) === teamName);
}
function bracketsPickedFinalWinner(teamName) {
  return brackets.filter(b => getBracketFinalWinner(b.data) === teamName);
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  renderBracket();
  const lbTitle = document.getElementById('lbTitle');
  if (lbTitle) lbTitle.textContent = viewingBracketIdx !== null ? brackets[viewingBracketIdx].name : 'Rankings';
  renderLegend();
}

// ── SCORING ───────────────────────────────────────────────────────────────────
const ROUND_POINTS = [1, 2, 4, 8]; // R32, R16, QF, SF (per side)
const FINAL_POINTS  = 16;
const THIRD_POINTS  = 8;

function scoreFor(b) {
  let pts = 0;
  // Left and right side rounds
  ['left','right'].forEach(side => {
    COUNTS_SIDE.forEach((count, ri) => {
      const ppw = ROUND_POINTS[ri];
      for (let mi = 0; mi < count; mi++) {
        const actual = results[side][ri][mi];
        if (actual.winner === null) continue;
        const actualWinner = actual.teams[actual.winner].name;
        if (getBracketWinner(b.data, side, ri, mi) === actualWinner) pts += ppw;
      }
    });
  });
  // Final
  if (results.final.winner !== null) {
    const actualFinal = results.final.teams[results.final.winner].name;
    if (getBracketFinalWinner(b.data) === actualFinal) pts += FINAL_POINTS;
  }
  // Third place
  if (results.third.winner !== null) {
    const actualThird = results.third.teams[results.third.winner].name;
    try {
      const bThird = b.data.third;
      if (bThird && bThird.winner !== null && bThird.teams[bThird.winner].name === actualThird) pts += THIRD_POINTS;
    } catch {}
  }
  return pts;
}

// Teams that have already lost in the actual results (and are thus eliminated)
function eliminatedTeams() {
  const set = new Set();
  const addLoser = (m) => {
    if (!m || m.winner === null || m.winner === undefined) return;
    const loser = m.teams[m.winner === 0 ? 1 : 0];
    if (loser && loser.name && loser.name !== 'TBD') set.add(loser.name);
  };
  ['left','right'].forEach(side => {
    COUNTS_SIDE.forEach((count, ri) => {
      for (let mi = 0; mi < count; mi++) addLoser(results[side][ri][mi]);
    });
  });
  addLoser(results.final);
  return set;
}

// Red → yellow → green gradient across the range of max scores (lowest red, highest green)
function maxScoreColor(val, lo, hi) {
  const t = hi > lo ? (val - lo) / (hi - lo) : 1;
  const hue = t * 120; // 0 = red, 120 = green
  return `hsl(${hue}, 70%, 60%)`;
}

// Best possible score: every still-alive pick wins whenever the match is undecided
function maxScoreFor(b, elim) {
  let pts = 0;
  const stillPossible = (pick) => pick && pick !== 'TBD' && !elim.has(pick);
  ['left','right'].forEach(side => {
    COUNTS_SIDE.forEach((count, ri) => {
      const ppw = ROUND_POINTS[ri];
      for (let mi = 0; mi < count; mi++) {
        const actual = results[side][ri][mi];
        const pick = getBracketWinner(b.data, side, ri, mi);
        if (actual.winner !== null) {
          if (pick === actual.teams[actual.winner].name) pts += ppw;
        } else if (stillPossible(pick)) {
          pts += ppw;
        }
      }
    });
  });
  // Final
  const finalPick = getBracketFinalWinner(b.data);
  if (results.final.winner !== null) {
    if (finalPick === results.final.teams[results.final.winner].name) pts += FINAL_POINTS;
  } else if (stillPossible(finalPick)) {
    pts += FINAL_POINTS;
  }
  // Third place
  let thirdPick = null;
  try { const t = b.data.third; if (t && t.winner !== null) thirdPick = t.teams[t.winner].name; } catch {}
  if (results.third.winner !== null) {
    if (thirdPick && thirdPick === results.third.teams[results.third.winner].name) pts += THIRD_POINTS;
  } else if (stillPossible(thirdPick)) {
    pts += THIRD_POINTS;
  }
  return pts;
}

function renderLegend() {
  const bar = document.getElementById('legendBar');
  if (!bar) return;
  if (!brackets.length) {
    bar.innerHTML = '<span class="legend-empty">No brackets loaded — click "+ Add bracket" to start</span>';
    return;
  }

  const elim = eliminatedTeams();
  const scored = brackets.map((b, i) => ({ ...b, i, pts: scoreFor(b), maxPts: maxScoreFor(b, elim) }))
    .sort((a, b) => b.pts - a.pts);

  let place = 1;
  const ranked = scored.map((b, i) => {
    if (i > 0 && b.pts < scored[i - 1].pts) place = i + 1;
    return { ...b, place };
  });

  const maxPts = Math.max(...scored.map(b => b.pts), 1);
  const maxVals = scored.map(b => b.maxPts);
  const loMax = Math.min(...maxVals), hiMax = Math.max(...maxVals);
  const rankColors = { 1: 'gold', 2: 'silver', 3: 'bronze' };
  const backBtn = viewingBracketIdx !== null
    ? '<button type="button" class="lb-back-btn" onclick="showActualBracket()">← Actual results</button>'
    : '';

  bar.innerHTML = `${backBtn}<div class="leaderboard">${
    ranked.map((b) => {
      const pct = maxPts > 0 ? (b.pts / maxPts) * 100 : 0;
      const active = viewingBracketIdx === b.i ? ' active' : '';
      const placeLabel = b.place <= 3 ? b.place : '';
      const placeClass = rankColors[b.place] || '';
      return `
        <div class="lb-row${active}">
          <div class="lb-rank ${placeClass}">${placeLabel}</div>
          <div class="lb-dot" style="${colorBgStyle(b.color)}"></div>
          <div class="lb-name" onclick="showBracket(${b.i})" title="View ${b.name}'s bracket">${b.name}</div>
          <div class="lb-bar-track">
            <div class="lb-bar-fill" style="width:${pct}%;${colorBgStyle(b.color)}"></div>
          </div>
          <div class="lb-score">${b.pts} <span class="lb-max" style="color:${maxScoreColor(b.maxPts, loMax, hiMax)}">(${b.maxPts})</span></div>
        </div>`;
    }).join('')
  }</div>`;
}

      content.className = 'mc-content';
      content.innerHTML = `<span class="flag">${team.flag}</span><span class="tname">${team.abbr||team.name||''}</span>${isPicked?'<span class="pick-check">✓</span>':''}`;
      mc.appendChild(content);

      if (pickers.length) {
        const dotRow = document.createElement('div');
        dotRow.className = 'dot-row';
        pickers.forEach(p => {
          const d = document.createElement('div');
          d.className = 'pick-dot';
          d.style.cssText = colorBgStyle(p.color);
          dotRow.appendChild(d);
        });
        mc.appendChild(dotRow);
      }

      attachActualPick(mc, match, ti, actualPickKey(side, ri, mi), (t) => pickActualSide(side, ri, mi, t), () => clearActualSide(side, ri, mi));
      pair.appendChild(mc);
    });

    slot.appendChild(pair);
    slots.appendChild(slot);
  }
  col.appendChild(slots);
  container.appendChild(col);
}

function appendGapCol(container, side, ri) {
  const gap = document.createElement('div');
  gap.className = 'gap-col';
  gap.dataset.side = side; gap.dataset.ri = ri;
  container.appendChild(gap);
}

function renderHalfEarly(container, side, display, dots, hypothetical) {
  if (side === 'left') {
    for (let ri = 0; ri < 3; ri++) {
      if (ri > 0) appendGapCol(container, side, ri);
      renderRoundCol(container, side, ri, display, dots, hypothetical);
    }
    appendGapCol(container, side, 3);
  } else {
    appendGapCol(container, side, 3);
    for (let ri = 2; ri >= 0; ri--) {
      renderRoundCol(container, side, ri, display, dots, hypothetical);
      if (ri > 0) appendGapCol(container, side, ri);
    }
  }
}

function renderHalfSf(container, side, display, dots, hypothetical) {
  renderRoundCol(container, side, 3, display, dots, hypothetical);
}

function renderHalf(container, side, display, dots, hypothetical) {
  renderHalfEarly(container, side, display, dots, hypothetical);
  renderHalfSf(container, side, display, dots, hypothetical);
}

// ── LINES ────────────────────────────────────────────────────────────────────
const HYPO_LINE_COLOR = '#15803d';
const NO_PICKER_LINE_COLOR = '#7a8494';
const LINE_SPREAD = 2.5;

function lineStagger(y1, y3, bandTop, bandBot, pickerOff, pickerCount, fromX, toX) {
  if (pickerCount > 1) return { lineOff: pickerOff };
  return { lineOff: 0 };
}

function staggerVertX(fromX, toX, y1, y3, lineOff) {
  if (Math.abs(y3 - y1) < 1) return (fromX + toX) / 2;
  const minX = Math.min(fromX, toX);
  const maxX = Math.max(fromX, toX);
  const ltr = fromX < toX;
  const goingDown = y3 > y1;
  const gapW = maxX - minX;
  if (gapW < 0.5) return (fromX + toX) / 2;

  const center = gapW / 2;
  let pos = goingDown ? center - lineOff : center + lineOff;
  pos = Math.max(0, Math.min(gapW, pos));
  return ltr ? minX + pos : maxX - pos;
}

function drawLines() {
  if (viewingBracketIdx === null) drawAllLines();
  else drawHypotheticalLines(bracketDisplayData());
}

function drawHypotheticalLines(display) {
  const el = document.getElementById('bracket');

  el.querySelectorAll('.gap-col').forEach(gap => {
    const side = gap.dataset.side, ri = parseInt(gap.dataset.ri), prevRi = ri - 1;
    const isRight = side === 'right';
    const gapRect = gap.getBoundingClientRect();
    const { svg } = makeSVG(gap, gapRect);
    const x0 = 0, x1 = gapRect.width;
    const fromX = isRight ? x1 : x0, toX = isRight ? x0 : x1;

    for (let mi = 0; mi < COUNTS_SIDE[ri]; mi++) {
      const dstSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${ri}"][data-mi="${mi}"]`);
      if (!dstSlot) continue;
      const dstMcs = dstSlot.querySelectorAll('.mc');
      if (dstMcs.length < 2) continue;

      const dstY0 = midY(dstMcs[0], gapRect), dstY1 = midY(dstMcs[1], gapRect);
      const bandTop = Math.min(dstY0, dstY1), bandBot = Math.max(dstY0, dstY1);

      [0, 1].forEach(arm => {
        const srcMi = mi * 2 + arm;
        const rm = display[side][prevRi][srcMi];
        if (rm.winner === null) return;

        const winnerName = rm.teams[rm.winner].name;
        const destMatch = display[side][ri][mi];
        if (destMatch.teams[arm].name !== winnerName) return;
        if (destMatch.winner === null) return;
        if (destMatch.teams[destMatch.winner].name !== winnerName) return;

        const srcSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${prevRi}"][data-mi="${srcMi}"]`);
        if (!srcSlot) return;
        const srcMcs = srcSlot.querySelectorAll('.mc');
        if (!srcMcs[rm.winner]) return;
        const y1 = midY(srcMcs[rm.winner], gapRect);
        const y3 = midY(dstMcs[destMatch.winner], gapRect);
        const { lineOff } = lineStagger(y1, y3, bandTop, bandBot, 0, 1, fromX, toX);
        const xVert = staggerVertX(fromX, toX, y1, y3, lineOff);

        path(svg, fromX, y1, xVert, y3, toX, HYPO_LINE_COLOR, 2);
      });
    }
  });

  el.querySelectorAll('.final-gap').forEach(gap => {
    const side = gap.dataset.side, isRight = side === 'right';
    const sfRi = COUNTS_SIDE.length - 1;
    const gapRect = gap.getBoundingClientRect();
    const ti = side === 'left' ? 0 : 1;

    const sfSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${sfRi}"][data-mi="0"]`);
    const finalMcs = document.querySelectorAll('#final-match > .mc');
    const thirdMcs = document.querySelectorAll('#third-match > .mc');
    if (!sfSlot) return;
    const sfMcs = sfSlot.querySelectorAll('.mc');

    const rm = display[side][sfRi][0];
    if (rm.winner === null) return;
    const loserIdx = 1 - rm.winner;
    const winnerName = rm.teams[rm.winner].name;
    const loserName = rm.teams[loserIdx].name;

    const segs = [];

    const finalMatch = display.final;
    if (sfMcs[rm.winner] && finalMcs[ti]
        && finalMatch.teams[ti].name === winnerName
        && finalMatch.winner !== null
        && finalMatch.teams[finalMatch.winner].name === winnerName) {
      segs.push({ srcMc: sfMcs[rm.winner], dstMc: finalMcs[ti] });
    }

    const thirdMatch = display.third;
    if (sfMcs[loserIdx] && thirdMcs[ti]
        && thirdMatch.teams[ti].name === loserName) {
      segs.push({ srcMc: sfMcs[loserIdx], dstMc: thirdMcs[ti] });
    }

    if (!segs.length) return;

    const coords = segs.map(s => {
      const { fromX, toX } = finalGapX(isRight, s.srcMc, s.dstMc, gapRect);
      return { fromX, toX, srcY: midY(s.srcMc, gapRect), dstY: midY(s.dstMc, gapRect) };
    });
    const { svg, xOff } = makeSpanSVGFromCoords(gap, gapRect, coords);

    coords.forEach(c => {
      const bandTop = Math.min(c.srcY, c.dstY), bandBot = Math.max(c.srcY, c.dstY);
      const { lineOff } = lineStagger(c.srcY, c.dstY, bandTop, bandBot, 0, 1, c.fromX, c.toX);
      const xVert = staggerVertX(c.fromX, c.toX, c.srcY, c.dstY, lineOff);
      path(svg, c.fromX - xOff, c.srcY, xVert - xOff, c.dstY, c.toX - xOff, HYPO_LINE_COLOR, 2);
    });
  });
}

function drawAllLines() {
  const el = document.getElementById('bracket');

  el.querySelectorAll('.gap-col').forEach(gap => {
    const side = gap.dataset.side, ri = parseInt(gap.dataset.ri), prevRi = ri-1;
    const isRight = side==='right';
    const gapRect = gap.getBoundingClientRect();
    const { svg } = makeSVG(gap, gapRect);
    const x0=0, x1=gapRect.width;
    const fromX = isRight?x1:x0, toX = isRight?x0:x1;

    for (let mi=0; mi<COUNTS_SIDE[ri]; mi++) {
      const dstSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${ri}"][data-mi="${mi}"]`);
      if (!dstSlot) continue;
      const dstMcs = dstSlot.querySelectorAll('.mc');
      if (dstMcs.length < 2) continue;
      const dstY0 = midY(dstMcs[0], gapRect), dstY1 = midY(dstMcs[1], gapRect);
      const bandTop = Math.min(dstY0, dstY1), bandBot = Math.max(dstY0, dstY1);

      [0,1].forEach(arm => {
        const srcMi = mi*2+arm, dstY = arm===0?dstY0:dstY1;

        // Only draw a line if the ACTUAL RESULT has a winner for this source match
        const rm = results[side][prevRi][srcMi];
        if (rm.winner === null) return;
        const actualWinnerName = rm.teams[rm.winner].name;

        const srcSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${prevRi}"][data-mi="${srcMi}"]`);
        if (!srcSlot) return;
        const srcMcs = srcSlot.querySelectorAll('.mc');
        if (!srcMcs[rm.winner]) return;
        const srcY = midY(srcMcs[rm.winner], gapRect);

        // Find every bracket that also picked the actual winner for this match
        const pickers = brackets.filter(b => getBracketWinner(b.data, side, prevRi, srcMi) === actualWinnerName);
        if (!pickers.length) {
          const { lineOff } = lineStagger(srcY, dstY, bandTop, bandBot, 0, 1, fromX, toX);
          const xVert = staggerVertX(fromX, toX, srcY, dstY, lineOff);
          path(svg, fromX, srcY, xVert, dstY, toX, NO_PICKER_LINE_COLOR, 2, true);
          return;
        }

        const totalOff = (pickers.length - 1) * LINE_SPREAD;
        pickers.forEach((b, i) => {
          const off = -totalOff / 2 + i * LINE_SPREAD;
          const y1 = srcY + off, y3 = dstY + off;
          const { lineOff } = lineStagger(y1, y3, bandTop, bandBot, off, pickers.length, fromX, toX);
          const xVert = staggerVertX(fromX, toX, y1, y3, lineOff);
          path(svg, fromX, y1, xVert, y3, toX, strokeColor(b.color), 2);
        });
      });
    }
  });

  // Final gaps: SF winner → final, SF loser → third place
  el.querySelectorAll('.final-gap').forEach(gap => {
    const side = gap.dataset.side, isRight = side==='right';
    const sfRi = COUNTS_SIDE.length-1;
    const gapRect = gap.getBoundingClientRect();
    const ti = side==='left'?0:1;

    const sfSlot = el.querySelector(`.team-slot[data-side="${side}"][data-ri="${sfRi}"][data-mi="0"]`);
    const finalMcs = document.querySelectorAll('#final-match > .mc');
    const thirdMcs = document.querySelectorAll('#third-match > .mc');
    if (!sfSlot) return;
    const sfMcs = sfSlot.querySelectorAll('.mc');

    const rm = results[side][sfRi][0];
    if (rm.winner === null) return;
    const loserIdx = 1 - rm.winner;
    const actualWinnerName = rm.teams[rm.winner].name;
    const actualLoserName = rm.teams[loserIdx].name;

    const segs = [];
    if (sfMcs[rm.winner] && finalMcs[ti]) {
      segs.push({ srcMc: sfMcs[rm.winner], dstMc: finalMcs[ti], pickName: actualWinnerName });
    }
    if (sfMcs[loserIdx] && thirdMcs[ti]
        && results.third.teams[ti]?.name === actualLoserName) {
      segs.push({ srcMc: sfMcs[loserIdx], dstMc: thirdMcs[ti], pickName: actualWinnerName });
    }
    if (!segs.length) return;

    const coords = segs.map(s => {
      const { fromX, toX } = finalGapX(isRight, s.srcMc, s.dstMc, gapRect);
      return {
        fromX, toX,
        srcY: midY(s.srcMc, gapRect),
        dstY: midY(s.dstMc, gapRect),
        pickers: brackets.filter(b => getBracketWinner(b.data, side, sfRi, 0) === s.pickName),
      };
    });
    const { svg, xOff } = makeSpanSVGFromCoords(gap, gapRect, coords);

    coords.forEach(c => {
      const bandTop = Math.min(c.srcY, c.dstY), bandBot = Math.max(c.srcY, c.dstY);
      if (!c.pickers.length) {
        const { lineOff } = lineStagger(c.srcY, c.dstY, bandTop, bandBot, 0, 1, c.fromX, c.toX);
        const xVert = staggerVertX(c.fromX, c.toX, c.srcY, c.dstY, lineOff);
        path(svg, c.fromX - xOff, c.srcY, xVert - xOff, c.dstY, c.toX - xOff, NO_PICKER_LINE_COLOR, 2, true);
        return;
      }
      const totalOff = (c.pickers.length - 1) * LINE_SPREAD;
      c.pickers.forEach((b, i) => {
        const off = -totalOff / 2 + i * LINE_SPREAD;
        const y1 = c.srcY + off, y3 = c.dstY + off;
        const { lineOff } = lineStagger(y1, y3, bandTop, bandBot, off, c.pickers.length, c.fromX, c.toX);
        const xVert = staggerVertX(c.fromX, c.toX, y1, y3, lineOff);
        path(svg, c.fromX - xOff, y1, xVert - xOff, y3, c.toX - xOff, strokeColor(b.color), 2);
      });
    });
  });
}

function midY(el, gapRect) { const r=el.getBoundingClientRect(); return (r.top+r.bottom)/2-gapRect.top; }
function mcEdgeX(el, gapRect, edge) {
  const r = el.getBoundingClientRect();
  return (edge === 'left' ? r.left : r.right) - gapRect.left;
}
function makeSVG(gap, gapRect) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width', gapRect.width); svg.setAttribute('height', gapRect.height);
  Object.assign(svg.style,{position:'absolute',top:'0',left:'0',overflow:'visible'});
  gap.innerHTML=''; gap.appendChild(svg); return { svg, xOff: 0 };
}
function makeSpanSVG(gap, gapRect, fromX, toX) {
  return makeSpanSVGFromCoords(gap, gapRect, [{ fromX, toX }]);
}
function makeSpanSVGFromCoords(gap, gapRect, coords) {
  let minX = 0, maxX = gapRect.width;
  coords.forEach(c => {
    minX = Math.min(minX, c.fromX, c.toX);
    maxX = Math.max(maxX, c.fromX, c.toX);
  });
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width', maxX - minX);
  svg.setAttribute('height', gapRect.height);
  Object.assign(svg.style,{position:'absolute',top:'0',left:minX+'px',overflow:'visible'});
  gap.innerHTML=''; gap.appendChild(svg);
  return { svg, xOff: minX };
}
function finalGapX(isRight, srcMc, dstMc, gapRect) {
  const fromX = mcEdgeX(srcMc, gapRect, isRight ? 'left' : 'right');
  const toX = mcEdgeX(dstMc, gapRect, isRight ? 'right' : 'left');
  return { fromX, toX, xMid: (fromX + toX) / 2 };
}

// Elbow path: horiz → vertical → horiz
function path(svg, fromX, y1, xVert, y3, toX, stroke, w, dashed) {
  const p = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  p.setAttribute('points', `${fromX},${y1} ${xVert},${y1} ${xVert},${y3} ${toX},${y3}`);
  p.setAttribute('stroke', stroke);
  p.setAttribute('stroke-width', w);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  if (dashed) p.setAttribute('stroke-dasharray', '5 4');
  svg.appendChild(p);
}
function line(svg,x1,y1,x2,y2,stroke,w) {
  if (Math.abs(x1-x2)<0.1&&Math.abs(y1-y2)<0.1) return;
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
  l.setAttribute('stroke',stroke);l.setAttribute('stroke-width',w);l.setAttribute('stroke-linecap','round');
  svg.appendChild(l);
}

// ── IMPORT / AUTO-LOAD ───────────────────────────────────────────────────────
const BRACKET_DIR = 'brackets/';
const ACTUAL_FILE = 'actual';

function manifestFile() {
  const param = new URLSearchParams(location.search).get('manifest');
  if (param === 'local') return 'manifest.local.json';
  if (param === 'prod') return 'manifest.json';
  const host = location.hostname;
  if (host === 'localhost' || host === '127.0.0.1') return 'manifest.local.json';
  return 'manifest.json';
}

async function loadActualResults() {
  try {
    const res = await fetch(BRACKET_DIR + ACTUAL_FILE);
    if (!res.ok) throw new Error('actual');
    applyActualData(await res.json());
  } catch {
    results = buildResults();
    showToast('Could not load brackets/actual');
  }
}

function addBracketFromData(data, fallbackName) {
  if (!data.left || !data.right || !data.final) throw new Error('Invalid bracket');
  const name = data.bracketName || fallbackName || `Bracket ${brackets.length + 1}`;
  const color = PALETTE[nextColorIdx % PALETTE.length];
  nextColorIdx++;
  brackets.push({ id: Date.now() + nextColorIdx, name, color, data });
  return name;
}

async function loadAllBrackets() {
  brackets = [];
  nextColorIdx = 0;
  renderBracket();
  const bar = document.getElementById('legendBar');
  if (bar) bar.innerHTML = '<span class="legend-empty">Loading brackets…</span>';

  try {
    await loadActualResults();

    const manifestRes = await fetch(BRACKET_DIR + manifestFile());
    if (!manifestRes.ok) throw new Error('manifest');
    const files = (await manifestRes.json()).filter(f => f !== ACTUAL_FILE);

    const loaded = await Promise.all(files.map(async (file) => {
      const res = await fetch(BRACKET_DIR + encodeURIComponent(file));
      if (!res.ok) throw new Error(file);
      return { file, data: await res.json() };
    }));

    for (const { file, data } of loaded) {
      try { addBracketFromData(data, file); } catch {}
    }

    render();
    if (brackets.length) showToast(`Loaded ${brackets.length} brackets`);
  } catch {
    await loadActualResults();
    render();
    const bar = document.getElementById('legendBar');
    if (location.protocol === 'file:') {
      bar.innerHTML = '<span class="legend-empty">Auto-load needs a local server — run <code>python3 -m http.server</code> in this folder, or use "+ Add bracket"</span>';
    } else if (!brackets.length) {
      bar.innerHTML = '<span class="legend-empty">No brackets loaded — click "+ Add bracket" to start</span>';
    }
  }
}

function openImportModal() {
  document.getElementById('importPaste').value='';
  document.getElementById('fileName').textContent='';
  document.getElementById('importModal').classList.add('open');
  setTimeout(()=>document.getElementById('importPaste').focus(),50);
}
function closeImportModal() { document.getElementById('importModal').classList.remove('open'); }
function onFilePicked(e) {
  const file=e.target.files[0]; if(!file) return;
  document.getElementById('fileName').textContent=file.name;
  const reader=new FileReader();
  reader.onload=ev=>{document.getElementById('importPaste').value=ev.target.result;};
  reader.readAsText(file); e.target.value='';
}
function confirmImport() {
  const text=document.getElementById('importPaste').value.trim();
  if(!text){showToast('Paste JSON or choose a file');return;}
  try {
    const name=addBracketFromData(JSON.parse(text));
    closeImportModal(); render();
    showToast(`${name} added!`);
  } catch { showToast('Invalid JSON — check and try again'); }
}
function clearBrackets() { brackets=[]; nextColorIdx=0; viewingBracketIdx=null; render(); showToast('Brackets cleared'); }

function downloadSnapshot() {
  // Get current page HTML, inject the live state so it renders the same when opened
  let html = document.documentElement.outerHTML;
  // Replace the buildState/loadState init with hardcoded frozen state
  const frozenState = JSON.stringify({ results, brackets, nextColorIdx, viewingBracketIdx });
  const injection = `<script>
(function() {
  const frozen = ${frozenState};
  results = frozen.results;
  brackets = frozen.brackets;
  nextColorIdx = frozen.nextColorIdx;
  viewingBracketIdx = frozen.viewingBracketIdx ?? null;
  document.addEventListener('DOMContentLoaded', () => render());
})();
<\/script>`;
  // Inject just before </body>
  html = html.replace('</body>', injection + '</body>');
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wc2026_scorer_snapshot.html';
  a.click();
  showToast('Snapshot downloaded!');
}

document.getElementById('importModal').addEventListener('click',e=>{if(e.target===document.getElementById('importModal'))closeImportModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImportModal();});

function showToast(_msg) {}
window.addEventListener('resize', () => requestAnimationFrame(drawLines));
loadAllBrackets();
</script>
